name: Sync Standard Library Documentation

on:
  push:
    branches:
      # The website shows the latest release: move this to release/X.Y when X.Y is released
      # (see "Versions and branches" in the README)
      - release/0.5

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docs Repository
        uses: actions/checkout@v4
        with:
          path: 'docs-repo'

      - name: Checkout Website Repository
        uses: actions/checkout@v4
        with:
          repository: 'zenc-lang-ce/zenc-lang-ce.github.io'
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: 'website'

      - name: Sync Files to Website Repo
        # The same script previews the site locally: `make serve`
        run: docs-repo/scripts/sync_to_site.sh website

      - name: Commit and Push to Website Repo
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs.zenc-lang.org/content/docs/std/ docs.zenc-lang.org/content/docs/examples/rosetta/ docs.zenc-lang.org/content/docs/tour/ docs.zenc-lang.org/content/docs/install.md docs.zenc-lang.org/content/docs/changelog.md docs.zenc-lang.org/content/docs/editors.md docs.zenc-lang.org/content/docs/plugins.md docs.zenc-lang.org/content/docs/introduction.md docs.zenc-lang.org/content/docs/tools/ docs.zenc-lang.org/content/docs/migrations/ docs.zenc-lang.org/templates/
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-sync documentation and rosetta examples" && git pull --rebase origin main && git push)
